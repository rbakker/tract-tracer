<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tractogram.observer · docs</title>
<link rel="icon" href="favicon.ico">
<!--
  Shows a markdown document from this site, styled like the app:
      doc.html?markers-format     ->  docs/markers-format.md
  Only a plain name (letters, digits, - and _) is accepted, for a .md file
  in DOC_DIR (relative to this page). In the document, links to another .md file open it
  here (doc.html?name), so the same files also read well on GitHub. Scripts
  are linked to on GitHub, with full URLs.
-->
<style>
:root{--bg:#080b0f;--panel:#0c1018;--border:#2a3550;--accent:#9bf;--dim:#9ad;--text:#b8c4d0;--bright:#e4edf3;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,'Segoe UI',Roboto,sans-serif;}
main{max-width:860px;margin:0 auto;padding:32px 20px 64px;}
h1,h2,h3{color:var(--bright);font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:500;letter-spacing:0.02em;line-height:1.3;}
h1{font-size:22px;margin:0 0 20px;}
h2{font-size:17px;margin:36px 0 10px;padding-top:12px;border-top:1px solid var(--border);color:var(--accent);}
h3{font-size:15px;margin:24px 0 8px;}
a{color:var(--accent);}
code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:0.88em;color:var(--bright);background:var(--panel);
  border:1px solid var(--border);border-radius:3px;padding:0 4px;}
pre{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:12px 14px;overflow-x:auto;line-height:1.45;}
pre code{border:none;padding:0;background:none;font-size:13px;}
table{border-collapse:collapse;margin:12px 0;font-size:14px;display:block;overflow-x:auto;}
th,td{border:1px solid var(--border);padding:5px 10px;text-align:left;vertical-align:top;}
th{background:var(--panel);color:var(--bright);font-weight:500;}
.back{display:inline-block;margin-bottom:18px;font-size:13px;font-family:'JetBrains Mono',ui-monospace,monospace;}
.msg{color:var(--dim);}
</style>
</head>
<body>
<main>
  <a class="back" href="./">← tractogram.observer</a>
  <div id="doc" class="msg">loading…</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const DOC_DIR = 'docs/';   // where the .md files are, relative to this page

(async () => {
  const out = document.getElementById('doc');
  const name = decodeURIComponent(location.search.slice(1).split('&')[0]);
  if (!/^[A-Za-z0-9_-]+$/.test(name)) { out.textContent = 'No such document.'; return; }
  let text;
  try {
    const res = await fetch(DOC_DIR + name + '.md', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    text = await res.text();
  } catch (e) {
    out.textContent = 'Could not load ' + name + '.md (' + e.message + ').';
    return;
  }
  out.className = '';
  out.innerHTML = marked.parse(text);
  // a link to another document opens it here
  for (const a of out.querySelectorAll('a[href]')) {
    const m = a.getAttribute('href').match(/^(?:\.\/)?([A-Za-z0-9_-]+)\.md(#.*)?$/);
    if (m) a.href = '?' + m[1] + (m[2] || '');
  }
  const h1 = out.querySelector('h1');
  if (h1) document.title = h1.textContent + ' · tractogram.observer';
  if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
})();
</script>
</body>
</html>
